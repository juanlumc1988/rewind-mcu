# SPDX-License-Identifier: Apache-2.0
# Part of rewind -- deterministic record & replay for bare-metal firmware.
#
# Attaches the executables to a release.
#
#   * When a release is published, it builds that release's tag and attaches
#     the result. Nothing to do.
#   * For a release that already exists (1.0.0 was published before this
#     workflow was), run it by hand: Actions > Release binaries > Run workflow,
#     with the tag.
#
# The build is the one CI runs on every push (binaries.yml), from the tag's own
# source, so what is attached is what the tag says.

name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release, e.g. v1.0.0 (with or without the v)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag:
    name: which release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        env:
          FROM_RELEASE: ${{ github.event.release.tag_name }}
          FROM_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          given=${FROM_RELEASE:-$FROM_INPUT}
          # A version, with or without the v, and nothing else: it ends up in file
          # names and in commands.
          if ! printf '%s' "$given" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "'$given' is not a version tag like 1.0.0 or v1.0.0"; exit 1
          fi
          bare=${given#v}
          # The tag as it really is in the repository: as given, or with the v
          # added or taken off. Typing 1.0.0 for a tag named v1.0.0 is not an error.
          url=https://github.com/$GITHUB_REPOSITORY
          tag=
          for candidate in "$given" "$bare" "v$bare"; do
            if git ls-remote --exit-code --tags "$url" "refs/tags/$candidate" > /dev/null 2>&1; then
              tag=$candidate
              break
            fi
          done
          if [ -z "$tag" ]; then
            echo "there is no tag '$given' (nor '$bare' nor 'v$bare') in $GITHUB_REPOSITORY. Its tags:"
            git ls-remote --tags "$url" | sed 's#.*refs/tags/##' | grep -v '\^{}$' || true
            exit 1
          fi
          echo "building the tag $tag (version $bare)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$bare" >> "$GITHUB_OUTPUT"

  binaries:
    needs: tag
    uses: ./.github/workflows/binaries.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}

  attach:
    name: attach to the release
    needs: [tag, binaries]
    runs-on: ubuntu-24.04
    # Only this job can write to the repository, and only releases.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check what was built, and attach it
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          VERSION: ${{ needs.tag.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          ls -l
          # The version inside the files is the tag's: a mismatch means the wrong
          # source was built, and nothing should be attached.
          for f in rewind-*; do
            case $f in rewind-$VERSION-*) ;; *) echo "$f does not carry the version $VERSION"; exit 1 ;; esac
          done
          sha256sum -c *.sha256
          gh release view "$TAG" > /dev/null
          gh release upload "$TAG" --clobber \
                rewind-"$VERSION"-linux-x86_64.tar.gz rewind-"$VERSION"-linux-x86_64.tar.gz.sha256 \
                rewind-"$VERSION"-windows-x86_64.zip rewind-"$VERSION"-windows-x86_64.zip.sha256
          gh release view "$TAG" --json assets --jq '.assets[].name'
