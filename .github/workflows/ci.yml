# SPDX-License-Identifier: Apache-2.0
# Part of rewind -- deterministic record & replay for bare-metal firmware.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The host suite, on both compilers and both build types. Warnings are
  # errors here: the strict C++98 guard over core/, target/, sim/ and
  # firmware/ is enforced by the compiler, and a job that tolerated warnings
  # would quietly let it rot.
  host:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DREWIND_WERROR=ON \
                -DREWIND_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The CLI is the part a user actually touches, and none of the unit
      # tests exercise argument parsing or file I/O.
      - name: Exercise the command line
        run: |
          set -euo pipefail
          ./build/rewind --version | grep -E '^rewind [0-9]+\.[0-9]+\.[0-9]+ '
          ./build/rewind hunt --from 1 --to 30 --save /tmp/bug.rwd
          ./build/rewind dump /tmp/bug.rwd --limit 20
          ./build/rewind inspect /tmp/bug.rwd --find-consumed 5
          ./build/rewind inspect /tmp/bug.rwd --at 200 --walk 5
          ./build/rewind sizing --seed 7 --drain 512
          # A trace with the bug replays to a non-zero exit; a clean one
          # does not. Both are expected outcomes, so check them explicitly.
          ./build/rewind replay /tmp/bug.rwd
          ./build/rewind record --seed 1 --variant fixed --out /tmp/clean.rwd
          ./build/rewind replay /tmp/clean.rwd
          # A recording that starts mid-run carries its memory in the trace, and
          # replays to the state the whole run ends in.
          ./build/rewind record --seed 2 --variant fixed --iters 6000 --out /tmp/whole.rwd
          ./build/rewind record --seed 2 --variant fixed --iters 3000 --skip 3000 --out /tmp/half.rwd
          ./build/rewind dump /tmp/half.rwd --limit 6
          whole=$(./build/rewind replay /tmp/whole.rwd | grep -o 'state hash 0x[0-9A-F]*')
          half=$(./build/rewind replay /tmp/half.rwd --iters 3000 | grep -o 'state hash 0x[0-9A-F]*')
          echo "whole: $whole / from the middle: $half"
          test -n "$whole" && test "$whole" = "$half"

  # Address and undefined-behaviour sanitizers over the whole suite. The
  # trace reader parses input it has no reason to trust, and the tests feed
  # it deliberately malformed traces, so this is where that pays off.
  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build-san -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DREWIND_WERROR=ON \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

      - name: Build
        run: cmake --build build-san -j

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: ./build-san/rewind_tests

  # The premise of the whole project is that core/ and target/ cross-compile
  # to a microcontroller. Asserting that in a README is worth nothing; this
  # job proves it on every push, and reports the flash footprint while it is
  # there -- which is the number that decides whether recording is
  # affordable on a given part.
  cross-arm:
    name: arm-none-eabi (cortex-m4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Configure for the target
        run: |
          cmake -S . -B build-arm -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
                -DCMAKE_BUILD_TYPE=MinSizeRel \
                -DREWIND_BUILD_TESTS=OFF \
                -DREWIND_WERROR=ON

      # Only the libraries that would ship on the device. host/ is
      # workstation code and is not expected to cross-compile.
      - name: Build the target-side libraries
        run: |
          cmake --build build-arm -j \
                --target rewind_core rewind_target rewind_sim rewind_fw

      # The target side claims no heap, no exceptions and no RTTI. That claim
      # is checkable, so check it rather than trusting the review that let it
      # in: any of these symbols appearing as undefined means something in
      # core/ or target/ started pulling in a runtime the device may not have.
      - name: Assert no heap, exceptions or RTTI
        run: |
          set -euo pipefail
          undefined=$(arm-none-eabi-nm -u \
                        build-arm/librewind_core.a \
                        build-arm/librewind_target.a \
                      | grep -iE 'malloc|free|realloc|_Unwind|__cxa_throw|__cxa_begin_catch|typeinfo|operator new|operator delete' \
                      | sort -u || true)
          if [ -n "$undefined" ]; then
            echo "Target-side code pulled in a forbidden runtime dependency:"
            echo "$undefined"
            exit 1
          fi
          echo "clean: no heap, no exceptions, no RTTI"

      # What a project with firmware of its own does: install the device-side
      # libraries, and build its device code against them under the device's
      # rules (C++98, no exceptions, no RTTI). The thermostat in
      # examples/custom-firmware is that code, and it is the same source the
      # host replays.
      - name: Build a firmware of one's own against the installed libraries
        run: |
          set -euo pipefail
          cmake --install build-arm --prefix /tmp/rewind-arm
          test ! -e /tmp/rewind-arm/include/rewind/replay.h   # host code is not installed for the part
          arm-none-eabi-g++ -std=c++98 -pedantic-errors -Wall -Wextra -Werror -Wno-long-long \
                -mcpu=cortex-m4 -mthumb -Os -fno-exceptions -fno-rtti \
                -I/tmp/rewind-arm/include \
                -c examples/custom-firmware/thermostat.cpp -o /tmp/thermostat.o
          arm-none-eabi-size /tmp/thermostat.o
          if arm-none-eabi-nm -u /tmp/thermostat.o | grep -iE 'malloc|free|_Unwind|__cxa|typeinfo|operator new'; then
            echo "the example pulled in a forbidden runtime dependency"; exit 1
          fi

      - name: Report flash footprint
        run: |
          {
            echo "### Cortex-M4 footprint (MinSizeRel)"
            echo
            echo '```'
            arm-none-eabi-size -t build-arm/librewind_core.a \
                               build-arm/librewind_target.a
            echo '```'
            echo
            echo "\`text\` is flash; \`bss\` is the shim's own static state."
            echo "The trace and ring buffers are supplied by the caller and"
            echo "are not counted here."
          } >> "$GITHUB_STEP_SUMMARY"
          arm-none-eabi-size -t build-arm/librewind_core.a build-arm/librewind_target.a

  # The Cortex-M interrupt trampoline is ARM assembly that reads the exception
  # frame the core pushes, so the host tests cannot run it and the job above
  # only proves it compiles. QEMU can run it: pend an interrupt, record it, and
  # check the return address in the trace -- on the main stack and on the
  # process stack. A deliberately broken trampoline must fail the same check,
  # or the check proves nothing. Emulated, not silicon: it says nothing about
  # timing, and QEMU's NVIC has no DWT cycle counter.
  cortex-m-qemu:
    name: cortex-m4 interrupt trampoline (qemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No recommends: gcc-arm-none-eabi would otherwise pull in a ~3 GB
      # libstdc++ for newlib that the freestanding target side never links.
      - name: Install toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
                ninja-build gcc-arm-none-eabi binutils-arm-none-eabi qemu-system-arm

      - name: Build the target-side libraries
        run: |
          cmake -S . -B build-arm -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
                -DCMAKE_BUILD_TYPE=MinSizeRel \
                -DREWIND_BUILD_TESTS=OFF \
                -DREWIND_WERROR=ON
          cmake --build build-arm -j --target rewind_core rewind_target

      - name: Run the trampoline under QEMU
        run: tests/qemu/run.sh build-arm

  # The viewer needs Qt, so it is its own job and off in the others. Its tests
  # drive the real widgets with mouse, wheel and keys on a window with no
  # screen (the offscreen platform plugin), and the last step renders a window
  # the way the documentation's picture is made, to prove that path works too.
  viewer:
    name: rewind-gui (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
                ninja-build cmake g++ clang qt6-base-dev fonts-dejavu-core

      - name: Configure
        env:
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: |
          cmake -S . -B build-gui -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_COMPILER=$CXX \
                -DREWIND_WERROR=ON \
                -DREWIND_BUILD_GUI=ON

      - name: Build
        run: cmake --build build-gui -j

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-gui --output-on-failure

      - name: Render a comparison
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          # The buggy run exits 1 by design; the clean one exits 0.
          ./build-gui/rewind record --seed 2 --variant buggy --out /tmp/buggy.rwd || test $? -eq 1
          ./build-gui/rewind record --seed 2 --variant fixed --out /tmp/fixed.rwd
          ./build-gui/rewind-gui /tmp/buggy.rwd /tmp/fixed.rwd --first-diff \
                --screenshot /tmp/viewer.png --size 1180x720
          test "$(stat -c %s /tmp/viewer.png)" -gt 50000

      # A viewer for a firmware that is not the example: the same window, given
      # the factory for its own. Built the way a user's project would, against the
      # installed package.
      - name: Install, and build a viewer for another firmware against the package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          cmake --install build-gui --prefix /tmp/rewind-gui-prefix
          cmake -S examples/custom-firmware -B build-example -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }} \
                -DCMAKE_PREFIX_PATH=/tmp/rewind-gui-prefix
          cmake --build build-example -j
          ./build-example/thermostat_replay /tmp/thermostat.rwd
          ./build-example/thermostat_viewer /tmp/thermostat.rwd & pid=$!
          sleep 3
          kill -0 $pid   # still up: the window opened a trace and is running
          kill $pid

  # The installed package, from nothing: install rewind, then build a project
  # that is not part of it against what was installed -- through find_package,
  # as a user would -- and run it. Also that the version it announces is the
  # version it will accept being asked for, and no other major.
  package:
    name: installed package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build and install rewind
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DREWIND_BUILD_TESTS=OFF
          cmake --build build -j
          cmake --install build --prefix /tmp/rewind-prefix

      - name: Build and run a project of one's own against it
        run: |
          set -euo pipefail
          cmake -S examples/custom-firmware -B build-example -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/tmp/rewind-prefix
          cmake --build build-example -j
          ./build-example/thermostat_replay /tmp/thermostat.rwd
          # And the installed command line reads the trace the example wrote.
          /tmp/rewind-prefix/bin/rewind --version
          /tmp/rewind-prefix/bin/rewind dump /tmp/thermostat.rwd --limit 5

      - name: The package accepts its own major version and no other
        run: |
          set -euo pipefail
          mkdir /tmp/vt
          printf 'cmake_minimum_required(VERSION 3.16)\nproject(vt LANGUAGES CXX)\nfind_package(rewind ${V} REQUIRED)\n' > /tmp/vt/CMakeLists.txt
          for ok in 1 1.0; do
            cmake -S /tmp/vt -B /tmp/vt/b-$ok -DV=$ok -DCMAKE_PREFIX_PATH=/tmp/rewind-prefix
          done
          for refused in 2 0.9 1.5; do
            if cmake -S /tmp/vt -B /tmp/vt/b-$refused -DV=$refused -DCMAKE_PREFIX_PATH=/tmp/rewind-prefix; then
              echo "find_package(rewind $refused) should have been refused"; exit 1
            fi
          done
